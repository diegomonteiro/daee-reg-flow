name: Validate REG-FLOW
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/hydrology/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - run: python -m pip install -r scripts/hydrology/requirements.txt
      - run: npm ci
      - run: npm run test:all
      - run: npm audit --omit=dev
